<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lexi – Voice Vocabulary Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf1f6;--surface:#fff;--ink:#12213a;--muted:#5b6b82;--accent:#2563eb;--good:#12805c;--bad:#c4372f;--line:#d3deea;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1626;--surface:#16233a;--ink:#e8eef8;--muted:#9fb0c8;--accent:#6ea0ff;--good:#4cd3a0;--bad:#ff8a80;--line:#25364f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1626;--surface:#16233a;--ink:#e8eef8;--muted:#9fb0c8;--accent:#6ea0ff;--good:#4cd3a0;--bad:#ff8a80;--line:#25364f;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:24px 18px 40px}
h1{font-size:2rem;font-weight:800;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);margin:4px 0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.word{font-size:2.4rem;font-weight:800;letter-spacing:-.02em;margin:0;min-height:1.2em}
.pos{color:var(--muted);margin:0 0 8px}
.def{margin:0 0 6px;font-size:1.05rem}
.ex{margin:0;color:var(--muted);font-style:italic}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:12px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.stage{display:flex;flex-direction:column;align-items:center;margin:26px 0 14px}
#orb{width:112px;height:112px;border-radius:50%;border:0;background:var(--accent);color:#fff;font:600 1rem inherit;font-family:inherit;cursor:pointer;box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent);transition:background .2s}
#orb:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#orb.listening{background:var(--good);animation:pulse 1.4s infinite}
#orb.speaking{background:var(--ink);color:var(--bg);animation:pulse 1.9s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 40%,transparent)}100%{box-shadow:0 0 0 30px transparent}}
@media (prefers-reduced-motion:reduce){#orb{animation:none!important}}
#status{margin-top:12px;color:var(--muted);min-height:1.5em}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0 16px}
.chip{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.send{background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:0 18px;font:600 1rem inherit;font-family:inherit;cursor:pointer}
#log{margin-top:20px;display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto}
.m{padding:9px 13px;border-radius:14px;max-width:88%}
.m.a{background:var(--surface);border:1px solid var(--line);align-self:flex-start}
.m.u{background:var(--accent);color:#fff;align-self:flex-end}
.good{color:var(--good)}.bad{color:var(--bad)}
.note{color:var(--muted);font-size:.85rem;margin-top:16px}
</style>
</head>
<body>
<main>
  <h1>Lexi</h1>
  <p class="sub">A voice coach for building your vocabulary. Talk to it, or type.</p>

  <div class="card" aria-live="polite">
    <div class="meta"><span id="phase">Ready</span><span id="score">Score 0</span></div>
    <div class="bar"><i id="prog"></i></div>
    <p class="word" id="word">Press start</p>
    <p class="pos" id="pos"></p>
    <p class="def" id="def">Lexi will teach you 5 words, then quiz you on them.</p>
    <p class="ex" id="ex"></p>
  </div>

  <div class="stage">
    <button id="orb" aria-label="Start or toggle microphone">Start</button>
    <div id="status">Tap Start. Lexi speaks first.</div>
  </div>

  <div class="chips" role="group" aria-label="Quick commands">
    <button class="chip" data-c="next">Next</button>
    <button class="chip" data-c="repeat">Repeat</button>
    <button class="chip" data-c="hint">Hint</button>
    <button class="chip" data-c="skip">Skip</button>
  </div>

  <div class="row">
    <input id="txt" placeholder="Or type your answer…" aria-label="Type your answer" autocomplete="off">
    <button class="send" id="send">Send</button>
  </div>

  <div id="log"></div>
  <p class="note" id="note"></p>
</main>

<script>
const BANK=[
["ephemeral","adj.","lasting for a very short time","The beauty of the cherry blossoms is ephemeral."],
["ubiquitous","adj.","seeming to be everywhere at once","Smartphones have become ubiquitous."],
["pragmatic","adj.","dealing with things sensibly and realistically","She took a pragmatic approach to the budget."],
["meticulous","adj.","showing great attention to detail","He kept meticulous notes on every experiment."],
["resilient","adj.","able to recover quickly from difficulty","Children are often remarkably resilient."],
["candid","adj.","honest and straightforward, even if it is uncomfortable","I appreciated her candid feedback."],
["benevolent","adj.","kind, generous and well meaning","A benevolent donor funded the library."],
["scrutinize","verb","to examine something very carefully","Auditors scrutinize every invoice."],
["mitigate","verb","to make something bad less severe","Planting trees can mitigate flooding."],
["eloquent","adj.","fluent and persuasive in speech or writing","Her eloquent speech moved the audience."],
["ambiguous","adj.","open to more than one meaning","The contract wording was ambiguous."],
["tenacious","adj.","holding firmly to a goal and not giving up","A tenacious reporter chased the story for years."]
];
const $=id=>document.getElementById(id);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const synth=window.speechSynthesis;
let rec=null,words=[],phase="idle",i=0,tries=0,score=0,micOn=true,speaking=false,started=false;

if(!SR)$("note").textContent="Your browser has no speech recognition (try Chrome, Edge or Safari). Lexi will still speak, and you can type your answers.";
if(!synth)$("note").textContent="Speech output isn’t available in this browser. You can still read and type.";

function log(t,who){const d=document.createElement("div");d.className="m "+who;d.textContent=t;$("log").appendChild(d);$("log").scrollTop=1e9}
function setOrb(s,label){const o=$("orb");o.className=s;o.textContent=label}
function status(t){$("status").textContent=t}

function say(text,then){
  log(text,"a");stopListen();
  if(!synth){then&&then();listenSoon();return}
  synth.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.95;
  u.onstart=()=>{speaking=true;setOrb("speaking","Lexi");status("Lexi is speaking…")};
  u.onend=()=>{speaking=false;then&&then();listenSoon()};
  u.onerror=u.onend;
  synth.speak(u);
}
function listenSoon(){if(micOn&&SR&&phase!=="done")setTimeout(startListen,250);else idle()}
function idle(){setOrb("","Mic");status(SR?"Tap the mic to talk, or type below.":"Type your answer below.")}
function startListen(){
  if(!SR||speaking||rec)return;
  rec=new SR();rec.lang="en-US";rec.interimResults=true;rec.maxAlternatives=3;
  let final="";
  rec.onstart=()=>{setOrb("listening","Listening");status("Listening… say your answer")};
  rec.onresult=e=>{let t="";for(let k=e.resultIndex;k<e.results.length;k++){t+=e.results[k][0].transcript;if(e.results[k].isFinal)final=t}status("“"+t+"”")};
  rec.onerror=e=>{rec=null;setOrb("","Mic");const m={"not-allowed":"Microphone is blocked here. Open this page in its own browser tab (not inside the preview) and allow the mic, or type below.","service-not-allowed":"Speech recognition is blocked in this view. Open the page in its own tab in Chrome, or type below.","no-speech":"I didn’t hear anything. Tap the mic and try again.","audio-capture":"No microphone found. Check your device, or type below.","network":"Speech recognition needs an internet connection. Try again, or type below.","aborted":"Mic stopped. Tap it to try again."};if(e.error==="not-allowed"||e.error==="service-not-allowed")micOn=false;status(m[e.error]||("Mic error: "+e.error+". You can type instead."))};
  rec.onend=()=>{rec=null;if(final)handle(final);else if($("status").textContent.startsWith("Listening"))idle()};
  try{rec.start()}catch(err){rec=null;status("Couldn’t start the mic: "+err.message+". Type below instead.")}
}
function stopListen(){if(rec){const r=rec;rec=null;r.onend=null;try{r.abort()}catch(_){}}}

function norm(s){return s.toLowerCase().replace(/[^a-z\s]/g," ").replace(/\s+/g," ").trim()}
function lev(a,b){const m=[...Array(a.length+1)].map((_,x)=>[x]);for(let y=1;y<=b.length;y++)m[0][y]=y;
  for(let x=1;x<=a.length;x++)for(let y=1;y<=b.length;y++)m[x][y]=Math.min(m[x-1][y]+1,m[x][y-1]+1,m[x-1][y-1]+(a[x-1]===b[y-1]?0:1));return m[a.length][b.length]}
function matches(said,target){return norm(said).split(" ").some(w=>w===target||(w.length>3&&lev(w,target)<=Math.max(1,Math.floor(target.length/5))))}

function card(w,reveal){
  $("word").textContent=reveal?w[0]:"? ? ?";
  $("pos").textContent=reveal?w[1]:"";
  $("def").textContent=w[2].charAt(0).toUpperCase()+w[2].slice(1);
  $("ex").textContent=reveal?"“"+w[3]+"”":"";
}
function progress(){
  const total=words.length*2,done=phase==="teach"?i:phase==="quiz"?words.length+i:total;
  $("prog").style.width=(done/total*100)+"%";
  $("phase").textContent=phase==="teach"?`Learn ${i+1} of ${words.length}`:phase==="quiz"?`Quiz ${i+1} of ${words.length}`:"Finished";
  $("score").textContent="Score "+score;
}

function start(){
  started=true;score=0;i=0;
  words=[...BANK].sort(()=>Math.random()-.5).slice(0,5);
  phase="teach";
  say("Hi, I’m Lexi. We’ll learn five words, then I’ll quiz you. You can say next, repeat, hint or skip at any time. Let’s begin.",teach);
}
function teach(){
  const w=words[i];progress();card(w,true);
  say(`Word ${i+1}: ${w[0]}. ${w[1]==="adj."?"An adjective":"A verb"}. It means ${w[2]}. For example: ${w[3]} Say it with me: ${w[0]}. Then say next.`);
}
function quiz(){
  const w=words[i];tries=0;progress();card(w,false);
  say(`Which word means: ${w[2]}?`);
}
function finish(){
  phase="done";progress();micOn=false;
  const pct=Math.round(score/words.length*100);
  $("word").textContent=`${score} / ${words.length}`;$("pos").textContent="";
  $("def").textContent=pct>=80?"Excellent work.":pct>=50?"Good effort. Run it again to lock them in.":"Keep going. Repetition is how words stick.";
  $("ex").textContent="Words: "+words.map(w=>w[0]).join(", ");
  say(`That’s the end. You got ${score} out of ${words.length}. The words were: ${words.map(w=>w[0]).join(", ")}. Tap Start to play again.`);
  $("orb").textContent="Restart";$("orb").className="";
}
function advanceQuiz(){i++;i<words.length?quiz():finish()}

function handle(raw){
  const t=norm(raw);if(!t)return;
  log(raw,"u");
  if(!started||phase==="idle"||phase==="done"){micOn=true;return start()}
  const w=words[i];
  if(/\b(repeat|again|say that)\b/.test(t))return phase==="teach"?teach():quiz();
  if(/\b(stop|quit|end)\b/.test(t)&&phase!=="idle"){return finish()}
  if(phase==="teach"){
    if(/\b(skip|next|continue|ok|okay|yes|ready|done|got it)\b/.test(t)||matches(t,w[0])){
      i++;
      if(i<words.length){say(matches(t,w[0])?"Great pronunciation. Next word.":"Next word.",teach)}
      else{phase="quiz";i=0;say("Now the quiz. Say the word that matches each meaning.",quiz)}
    }else say("Say next when you’re ready, or repeat to hear it again.");
    return;
  }
  if(phase==="quiz"){
    if(/\bhint\b/.test(t)){return say(`It starts with ${w[0][0]} and has ${w[0].length} letters.`)}
    if(/\b(skip|pass|i don.?t know)\b/.test(t)){card(w,true);return say(`It was ${w[0]}. ${w[3]}`,advanceQuiz)}
    if(matches(t,w[0])){
      const pts=tries===0?1:0;score+=pts;progress();card(w,true);
      return say(`${pts?"Correct!":"Yes, that’s it."} ${w[0]}. ${w[3]}`,advanceQuiz);
    }
    tries++;
    if(tries>=3){card(w,true);return say(`Not this time. The answer is ${w[0]}. ${w[3]}`,advanceQuiz)}
    say(tries===1?`Not quite. Here’s a hint: it starts with ${w[0][0]}. Try again.`:`Still not it. It has ${w[0].length} letters and starts with ${w[0].slice(0,2)}. One more try, or say skip.`);
  }
}

$("orb").onclick=()=>{
  if(!started||phase==="done"){micOn=true;return start()}
  if(speaking){synth.cancel();return}
  if(rec){stopListen();idle()}else{micOn=true;startListen()}
};
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{started?handle(b.dataset.c):start()});
function sendTxt(){const v=$("txt").value.trim();if(!v)return;$("txt").value="";stopListen();synth&&synth.cancel();handle(v)}
$("send").onclick=sendTxt;
$("txt").addEventListener("keydown",e=>{if(e.key==="Enter")sendTxt()});
</script>
</body>
</html>
